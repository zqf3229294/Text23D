<main class="workbench">
  <app-chat-panel
    [messages]="messages"
    [generation]="activeGeneration"
    [events]="generationEvents"
    [imageInputEnabled]="imageInputEnabled"
    [imageMaxUploadBytes]="imageMaxUploadBytes"
    [imageMaxCount]="imageMaxCountPerMessage"
    [imageAllowedTypes]="imageAllowedContentTypes"
    [isSending]="isSending"
    [loadError]="loadError"
    (send)="sendMessage($event)"
  ></app-chat-panel>

  <app-model-viewer [generation]="activeGeneration"></app-model-viewer>
</main>

[project]
name = "text23d-backend"
version = "0.1.0"
description = "FastAPI backend for the Text23D Mechanical MVP."
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.39.0",
  "fastapi>=0.115.0",
  "openai>=1.59.0",
  "pydantic-settings>=2.7.0",
  "python-dotenv>=1.0.1",
  "uvicorn[standard]>=0.34.0",
]

[project.optional-dependencies]
cad = [
  "cadquery>=2.5,<3; python_version < '3.13'",
]
render = [
  "pyvista>=0.45,<0.50",
]
dev = [
  "httpx>=0.28.0",
  "pytest>=8.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
